[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "getbible-bookmarks"
version = "1.0.0"
description = "Canonical getBible topic bookmarks: static JSON API builder and authenticated management service"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["tornado>=6.5,<7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]

[project.scripts]
getbible-bookmarks = "getbible_bookmarks.cli:main"

[tool.setuptools.packages.find]
include = ["getbible_bookmarks*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["v1", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF", "SIM", "PL"]
ignore = ["PLR0913", "PLR0912", "PLR0915", "PLR2004", "S101", "S603", "S607", "RUF012", "E501", "SIM108", "PLR0911", "PLW2901", "PLR1714"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "PL", "B", "RUF"]
"scripts/*" = ["S", "PL"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["getbible_bookmarks", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["tornado.*", "jsonschema", "jsonschema.*", "referencing", "referencing.*"]
ignore_missing_imports = true
