# getBible bookmarks API — nginx site.
#
# Static, precompressed JSON is served straight from the current release;
# only /v1/manage/ is proxied to the loopback management service.
#
# Install:
#   cp deploy/nginx/bookmarks.getbible.net.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/bookmarks.getbible.net.conf /etc/nginx/sites-enabled/
#   certbot --nginx -d bookmarks.getbible.net      # or supply your own certificates
#   nginx -t && systemctl reload nginx

limit_req_zone $binary_remote_addr zone=bookmarks_manage:1m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name bookmarks.getbible.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bookmarks.getbible.net;

    ssl_certificate     /etc/letsencrypt/live/bookmarks.getbible.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bookmarks.getbible.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bookmarks_ssl:10m;
    ssl_session_timeout 1d;

    # `current` is an atomically switched symlink to releases/<catalogue checksum>.
    root /srv/getbible-bookmarks/www/current;

    server_tokens off;
    access_log /var/log/nginx/bookmarks.getbible.net.access.log;
    error_log  /var/log/nginx/bookmarks.getbible.net.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        return 302 /v1/index.json;
    }

    # ---- management API (authenticated, low volume) -----------------------
    location /v1/manage/ {
        limit_req zone=bookmarks_manage burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;    # a mutation runs git fetch, commit and push
        proxy_send_timeout 60s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # ---- static JSON API (public, high volume) ----------------------------
    location /v1/ {
        index index.json;
        try_files $uri $uri/ =404;

        default_type application/json;
        types { application/json json; }
        charset utf-8;
        charset_types application/json;

        # Serve the precompressed .gz siblings written by `getbible-bookmarks publish`.
        gzip_static on;
        gzip on;
        gzip_types application/json;
        gzip_vary on;
        gzip_min_length 256;

        etag on;
        open_file_cache max=8192 inactive=120s;
        open_file_cache_valid 30s;
        open_file_cache_min_uses 1;
        open_file_cache_errors on;

        add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=604800" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "If-None-Match, If-Modified-Since, Accept, Accept-Encoding" always;
        add_header Access-Control-Expose-Headers "ETag, Last-Modified, Content-Length" always;
        add_header Access-Control-Max-Age "86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
        limit_except GET HEAD OPTIONS {
            deny all;
        }
    }

    location / {
        return 404;
    }
}
