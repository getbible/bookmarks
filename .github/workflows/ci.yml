name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install exact development requirements
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Configure git identity for publisher tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Run checks
        run: bash scripts/run-checks.sh

      - name: Require a catalog_version bump when data/ changes
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_catalog_version.py "origin/${{ github.base_ref }}" HEAD

  static-api:
    name: Static API tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the committed v1/ tree is a fresh deterministic build
        run: |
          python3 -m getbible_bookmarks validate
          python3 -m getbible_bookmarks build --check
      - name: Publish a release into a scratch directory
        run: |
          python3 -m getbible_bookmarks publish --target "$RUNNER_TEMP/www"
          test -f "$RUNNER_TEMP/www/current/v1/index.json"
          test -f "$RUNNER_TEMP/www/current/v1/catalog.json.gz"
      - name: Upload the API tree
        uses: actions/upload-artifact@v4
        with:
          name: bookmarks-api-v1
          path: v1
          retention-days: 14

  nginx:
    name: nginx configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate the site configuration syntax
        run: |
          mkdir -p "$RUNNER_TEMP/nginx/conf.d" "$RUNNER_TEMP/nginx/logs" "$RUNNER_TEMP/nginx/www/current/v1"
          echo '{}' > "$RUNNER_TEMP/nginx/www/current/v1/index.json"
          sed -e "s#/srv/getbible-bookmarks/www/current#$RUNNER_TEMP/nginx/www/current#" \
              -e "s#/etc/letsencrypt/live/bookmarks.getbible.net/fullchain.pem#$RUNNER_TEMP/nginx/cert.pem#" \
              -e "s#/etc/letsencrypt/live/bookmarks.getbible.net/privkey.pem#$RUNNER_TEMP/nginx/key.pem#" \
              -e "s#/var/log/nginx/#$RUNNER_TEMP/nginx/logs/#" \
              deploy/nginx/bookmarks.getbible.net.conf > "$RUNNER_TEMP/nginx/conf.d/site.conf"
          openssl req -x509 -newkey rsa:2048 -nodes -subj "/CN=bookmarks.getbible.net" \
            -keyout "$RUNNER_TEMP/nginx/key.pem" -out "$RUNNER_TEMP/nginx/cert.pem" -days 1 2>/dev/null
          cat > "$RUNNER_TEMP/nginx/nginx.conf" <<CONF
          events {}
          http {
            include /etc/nginx/mime.types;
            include $RUNNER_TEMP/nginx/conf.d/*.conf;
          }
          CONF
          # nginx -t opens the configured log files for writing, so the mount stays writable.
          docker run --rm -v "$RUNNER_TEMP/nginx:$RUNNER_TEMP/nginx" nginx:stable \
            nginx -t -c "$RUNNER_TEMP/nginx/nginx.conf"
